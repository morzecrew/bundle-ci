# bundle-ci's own checks. GitHub-hosted runners only: this repository is
# public, and a pull request from a fork must never run on a self-hosted
# machine.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT: "1.7.12"
  ZIZMOR: "1.30.0"
  # The runner's own shellcheck is another version, whose findings differ;
  # shellcheck publishes no checksums file, so the archive's digest is pinned.
  SHELLCHECK: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-v${SHELLCHECK}"

      - name: Shellcheck
        run: shellcheck -x scripts/*.sh tests/*/*.sh

      # The runner's yq is another program of the same name; pin.sh needs
      # mikefarah's.
      - name: Install yq
        run: |
          BIN_DIR="${RUNNER_TEMP}/bin" bash scripts/tools.sh yq
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Pin tests
        run: bash tests/pin/run.sh

      - name: Version tests
        run: bash tests/version/run.sh

      - name: Smoke tests
        run: bash tests/smoke/run.sh

      - name: Image cache tests
        run: bash tests/cache/run.sh

      - name: Changed image tests
        run: bash tests/changed/run.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}"
          curl -fsSL -o actionlint.tar.gz "${base}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/actionlint_${ACTIONLINT}_checksums.txt"
          grep " actionlint_${ACTIONLINT}_linux_amd64.tar.gz\$" checksums.txt | sed 's/ .*/  actionlint.tar.gz/' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tar.gz checksums.txt

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR}" --offline .github/workflows

      # A release rewrites every `bundle-ci-ref` default to its tag, so a
      # caller pinned to that tag runs that tag's scripts. One that drifted
      # would run another release's.
      - name: One bundle-ci-ref default
        run: |
          set -euo pipefail
          refs=$(grep -hE '^ +default: [^ ]+ # bundle-ci-ref:' .github/workflows/*.yml | awk '{print $2}' | sort -u)
          count=$(printf '%s\n' "${refs}" | grep -c .)
          [ "${count}" -eq 1 ] || { echo "::error::bundle-ci-ref defaults differ: ${refs//$'\n'/, }"; exit 1; }
          echo "bundle-ci-ref default: ${refs}"

      # A job without one runs for GitHub's 360 minutes when a self-hosted
      # runner hangs, holding the caller's concurrency group all that time. A
      # job that calls a workflow takes the called jobs' timeouts.
      - name: Every job has a timeout
        run: |
          set -euo pipefail
          missing=$(awk '
            FNR == 1 { if (job && !t) print file ": " job; job = ""; jobs = 0; file = FILENAME }
            /^jobs:/ { jobs = 1; next }
            jobs && /^  [a-z][a-z0-9-]*:[[:space:]]*$/ { if (job && !t) print file ": " job; job = $1; sub(/:$/, "", job); t = 0 }
            jobs && /^    (timeout-minutes|uses):/ { t = 1 }
            END { if (job && !t) print file ": " job }
          ' .github/workflows/*.yml)
          [ -z "${missing}" ] || { echo "::error::jobs without timeout-minutes: ${missing//$'\n'/, }"; exit 1; }

  # The repository's conventions, checked by the scripts of the skills that
  # define them (.agents/skills).
  conventions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CHANGELOG
        run: python3 .agents/skills/keep-a-changelog/scripts/validate_changelog.py CHANGELOG.md

      # A pull request is squashed under its title.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 .agents/skills/gitmoji-conventional/scripts/check_commit_msg.py --message "${TITLE}"

  # component-image.yml, called as a component repository calls it, on a
  # pull request alone: it plans, and builds tests/component when its paths
  # changed, and pushes nothing. The grants are its jobs' ceilings; on a pull
  # request nothing writes.
  component-image:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/component-image.yml # zizmor: ignore[self-repository] -- actionlint reads only ./
    with:
      component: selftest
      images: >-
        [{"name": "selftest", "image": "bundle-ci-selftest", "context": "tests/component",
          "file": "tests/component/Dockerfile", "build-arg-prefix": "APP__",
          "paths": ["tests/component/**", ".github/workflows/component-image.yml"]}]
