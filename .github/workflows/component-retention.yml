# Keep a component repository's packages inside the free plan's storage: the
# last `keep` commit builds (`sha-*`), which an older dev bundle may still
# install, and the one newest untagged version, both after a day. A version
# that also carries `main`, an `X.Y.Z` or a release's `bundle-X.Y.Z` is never
# deleted: snok/container-retention-policy v3 deletes a version only when
# every tag it carries matches the filter.
name: component-retention

on:
  workflow_call:
    inputs:
      images:
        description: The component's packages, space-separated, such as `demo-backend demo-migrations`
        type: string
        required: true
      keep:
        description: How many commit builds to keep per package
        type: number
        default: 3
      runs-on:
        description: The runner label the job runs on
        type: string
        default: ubuntu-24.04
    secrets:
      token:
        description: A token that may delete the packages' versions; GITHUB_TOKEN cannot
        required: true

permissions: {}

jobs:
  retention:
    runs-on: ${{ inputs.runs-on }}
    # A hung job fails here, not at GitHub's 360 minutes, which would hold
    # the caller's concurrency group and every run queued behind it. Each is
    # at least twice the longest successful run seen on self-hosted runners.
    timeout-minutes: 15
    # The package API is reached with the token secret, not GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Delete superseded builds
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.token }}
          image-names: ${{ inputs.images }}
          tag-selection: untagged
          keep-n-most-recent: 1
          cut-off: 1d

      - name: Delete old commit builds
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.token }}
          image-names: ${{ inputs.images }}
          image-tags: "sha-*"
          tag-selection: tagged
          keep-n-most-recent: ${{ inputs.keep }}
          cut-off: 1d
