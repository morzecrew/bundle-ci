# A release's GitHub release, for a bundle repository: the notes are the
# version's CHANGELOG section and the bundle's references, and the signed
# archive bundle.yml built in the same run is attached. A product's release
# workflow calls it after publish.yml. Two bundles released from one tag share
# the release: whichever comes second attaches its archive to it. It is a
# workflow of its own because it writes `contents`, which no other workflow
# asks a bundle repository for.
name: github-release

on:
  workflow_call:
    inputs:
      version:
        description: The version bundle.yml built and publish.yml published
        type: string
        required: true
      archive:
        description: The archive's file name in the `bundle` artifact
        type: string
        required: true
      changelog:
        description: The CHANGELOG whose `## [<version>]` section is the notes
        type: string
        default: CHANGELOG.md
      runs-on:
        description: The runner label the job runs on
        type: string
        default: ubuntu-24.04
      bundle-ci-ref:
        description: The bundle-ci ref whose scripts the job runs
        type: string
        default: v0.9.0 # bundle-ci-ref: a release rewrites this to its tag

permissions: {}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: morzecrew/bundle-ci
          ref: ${{ inputs.bundle-ci-ref }}
          path: .bundle-ci
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: ${{ runner.temp }}/dist

      - name: Notes from the CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          {
            echo "## Changelog"
            echo
            bash .bundle-ci/scripts/changelog-section.sh "${CHANGELOG}" "${VERSION}"
            echo
            echo "## Bundles"
            echo
            echo "Each \`<name>-${VERSION}.tar.zst\` attached is a bundle signed with the release key, also published as \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/<name>:${VERSION}\`, which \`:stable\` moved to."
          } >"${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Create the release, or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          archive=${RUNNER_TEMP}/dist/${ARCHIVE}
          # Another bundle of the same tag may have created it, before this
          # job or while it ran.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            ! gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
              --notes-file "${RUNNER_TEMP}/notes.md" "${archive}"; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}"
          fi
