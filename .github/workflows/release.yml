# A tag `vX.Y.Z` on main becomes a GitHub release whose notes are that
# version's CHANGELOG section. The release pull request sealed the section and
# set every `bundle-ci-ref` default to the tag; this refuses a tag where it did
# not, so no release names scripts other than its own.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that is not vX.Y.Z on main
        run: |
          set -euo pipefail
          [[ ${GITHUB_REF_NAME} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${GITHUB_REF_NAME} is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} does not point at a commit on main"; exit 1; }

      # A caller pinned to the tag runs the scripts its defaults name.
      - name: Refuse defaults that do not name the tag
        run: |
          set -euo pipefail
          refs=$(grep -hE '^ +default: [^ ]+ # bundle-ci-ref:' .github/workflows/*.yml | awk '{print $2}' | sort -u)
          [ "${refs}" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::${GITHUB_REF_NAME} carries bundle-ci-ref defaults ${refs//$'\n'/, }; delete the tag and release again"; exit 1; }

      - name: Take the notes from the CHANGELOG
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # The section under `## [X.Y.Z]`, up to the next `## [`, without the
          # link definitions the oldest section runs into.
          awk -v v="${version}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: / { print }' CHANGELOG.md | sed -e '/./,$!d' >"${RUNNER_TEMP}/notes.md"
          grep -q . "${RUNNER_TEMP}/notes.md" \
            || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          cat "${RUNNER_TEMP}/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
